 md:w-56"><p class="mb-20 text-sm text-slate-600">Mengetahui,</p><p class="font-bold border-t-2 border-slate-900 pt-2 text-sm md:text-base">Notulis</p></div></div></div></section></main><script>let topicCount = 1;
 // Formatter Waktu
 function formatDateTime(datetimeStr) {
 if (!datetimeStr) return '-';
 const date = new Date(datetimeStr);
 const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' };
 return date.toLocaleDateString('id-ID', options) + ' WIB';
 }
 // Fungsi Tambah Topik
 function addTopic() {
 topicCount++;
 const container = document.getElementById('topics-container');
 const topicHTML = `
 <div class="topic-input-block bg-white p-5 rounded-xl border-2 border-slate-200 shadow-sm relative mt-4" id="topic-block-${topicCount}" data-id="${topicCount}">
 <div class="flex justify-between items-center mb-4 border-b border-slate-100 pb-2">
 <h3 class="font-bold text-slate-700 flex items-center gap-2">
 <span class="bg-slate-600 text-white w-6 h-6 rounded-full flex items-center justify-center text-xs">${topicCount}</span>
 Topik Pembahasan Baru
 </h3>
 <button type="button" onclick="removeTopic(${topicCount})" class="text-red-500 hover:text-red-700 text-sm font-semibold flex items-center gap-1">
 <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg> Hapus
 </button>
 </div>
 <div class="space-y-4">
 <div>
 <label class="block text-sm font-semibold text-slate-700 mb-1">Pokok Bahasan</label>
 <textarea id="agenda-${topicCount}" rows="2" class="live-update w-full p-2.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Bahas apa nih?"></textarea>
 </div>
 <div>
 <label class="block text-sm font-semibold text-slate-700 mb-1">Hasil & Keputusan 💡</label>
 <textarea id="hasil-${topicCount}" rows="3" class="live-update w-full p-2.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Kesimpulannya apa?"></textarea>
 </div>
 <div>
 <label class="block text-sm font-semibold text-slate-700 mb-1">Action Items (Tindak Lanjut) 🚀</label>
 <textarea id="tindaklanjut-${topicCount}" rows="3" class="live-update w-full p-2.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-blue-50/50" placeholder="- Tugas A (PIC: Budi)"></textarea>
 </div>
 </div>
 </div>
 `;
 // Insert element
 container.insertAdjacentHTML('beforeend', topicHTML);
 // Re-attach listener buat elemen baru
 attachLiveUpdateListeners();
 updatePreview();
 }
 // Fungsi Hapus Topik
 function removeTopic(id) {
 const el = document.getElementById(`topic-block-${id}`);
 if (el) {
 el.remove();
 updatePreview();
 }
 }
 // Engine Live Update
 function updatePreview() {
 // Update Info Umum
 document.getElementById('prev-judul').innerText = document.getElementById('judul').value || 'NOTULEN RAPAT';
 document.getElementById('prev-waktu').innerText = formatDateTime(document.getElementById('waktu').value);
 document.getElementById('prev-lokasi').innerText = document.getElementById('lokasi').value || '-';
 // Ambil teks peserta, pecah per baris (enter)
 const rawPeserta = document.getElementById('peserta').value.trim();
 const prevPesertaEl = document.getElementById('prev-peserta');
 if (rawPeserta) {
 // Saring baris yang kosong biar nggak ikut kehitung
 // Sekaligus amankan dari tag HTML liar (XSS prevention)
 const lines = rawPeserta
 .split('\n')
 .filter(line => line.trim() !== '')
 .map(line => line.replace(/</g, "&lt;").replace(/>/g, "&gt;"));
 // Cari titik tengah (dibulatkan ke atas biar kalau ganjil, sisa 1 masuk ke kiri)
 const mid = Math.ceil(lines.length / 2);
 // Belah array jadi dua bagian, gabungkan dengan <br> untuk pindah baris
 const col1 = lines.slice(0, mid).join('<br>');
 const col2 = lines.slice(mid).join('<br>');
 // Injeksi ke dalam preview menggunakan sistem Grid 2 Kolom Tailwind
 prevPesertaEl.innerHTML = `
 <div class="grid grid-cols-2 gap-4 w-full">
 <div>${col1}</div>
 <div>${col2}</div>
 </div>
 `;
 } else {
